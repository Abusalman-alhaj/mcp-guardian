[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-guardian"
version = "0.1.0"
description = "Human-in-the-loop approval proxy for MCP tool calls"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
mcp-guardian = "mcp_guardian.app:main"

[tool.setuptools.packages.find]
where = ["src"]
